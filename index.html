<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ประกาศผลสอบ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#f3ece2; --surface:#e9dcc9; --ink:#3e2f23; --muted:#8a7560; --accent:#a0623a; --olive:#7a7a4f; --line:#d3c0a4; --box:#b5764a; --box2:#8f5a36; --ribbon:#e8d9b8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#231c16; --surface:#2e251d; --ink:#efe4d3; --muted:#a39079; --accent:#d58f5f; --olive:#a3a370; --line:#4a3c2e; --box:#a8693f; --box2:#7e4d2c; --ribbon:#e3d2ad;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#231c16; --surface:#2e251d; --ink:#efe4d3; --muted:#a39079; --accent:#d58f5f; --olive:#a3a370; --line:#4a3c2e; --box:#a8693f; --box2:#7e4d2c; --ribbon:#e3d2ad; color-scheme:dark;
}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Prompt','Noto Sans Thai',system-ui,sans-serif;overflow-x:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;transition:opacity .8s ease,transform .8s ease}
.hidden{opacity:0;pointer-events:none;transform:scale(.96)}

/* gift */
.gift{position:relative;width:170px;height:170px;margin-bottom:56px;animation:float 3s ease-in-out infinite}
.gift .body{position:absolute;bottom:0;left:10px;right:10px;height:110px;background:var(--box);border-radius:6px;box-shadow:0 18px 30px -12px rgba(0,0,0,.35)}
.gift .body::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:26px;margin-left:-13px;background:var(--ribbon)}
.gift .lid{position:absolute;bottom:106px;left:0;right:0;height:42px;background:var(--box2);border-radius:6px;transition:transform .9s cubic-bezier(.3,1.4,.5,1);transform-origin:left bottom}
.gift .lid::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:26px;margin-left:-13px;background:var(--ribbon)}
.gift .lid::after{content:"";position:absolute;top:-22px;left:50%;width:44px;height:26px;margin-left:-22px;border:6px solid var(--ribbon);border-radius:50% 50% 8px 8px}
.gift.open{animation:none}
.gift.open .lid{transform:translate(-18px,-70px) rotate(-24deg)}
.gift.open .body{animation:shake .5s}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.hint{color:var(--muted);font-size:14px;margin:0 0 20px;letter-spacing:.04em}
button.open-btn{font:500 16px 'Prompt','Noto Sans Thai',sans-serif;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:14px 32px;cursor:pointer;transition:transform .2s,opacity .2s}
button.open-btn:active{transform:scale(.96)}
button.open-btn:disabled{opacity:.5}

/* countdown */
.eyebrow{font-size:13px;letter-spacing:.3em;color:var(--olive);margin:0 0 8px;text-transform:uppercase}
h1{font-size:clamp(40px,10vw,64px);font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
.date{color:var(--muted);font-size:14px;margin:0 0 36px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:420px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 10px;text-align:center}
.cell b{display:block;font-size:clamp(34px,9vw,48px);font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.1}
.cell span{font-size:13px;color:var(--muted);letter-spacing:.1em}
.cell.ms{grid-column:span 2}
.cell.ms b{color:var(--accent)}
.done{font-size:24px;color:var(--accent);margin-top:28px;display:none}
@media (min-width:720px){.grid{max-width:760px;grid-template-columns:repeat(5,1fr)}.cell.ms{grid-column:auto}}
</style>
</head>
<body>

<div class="screen" id="giftScreen">
  <div class="gift" id="gift"><div class="lid"></div><div class="body"></div></div>
  <p class="hint">มีอะไรบางอย่างรอคุณอยู่…</p>
  <button class="open-btn" id="openBtn">กดเพื่อดูของด้านใน</button>
</div>

<div class="screen hidden" id="cdScreen">
  <p class="eyebrow">Countdown</p>
  <h1>เปิดเทอม</h1>
  <p class="date">26 ตุลาคม 2026 · 07:00 น.</p>
  <div class="grid">
    <div class="cell"><b id="d">00</b><span>วัน</span></div>
    <div class="cell"><b id="h">00</b><span>ชั่วโมง</span></div>
    <div class="cell"><b id="m">00</b><span>นาที</span></div>
    <div class="cell"><b id="s">00</b><span>วินาที</span></div>
    <div class="cell ms"><b id="ms">000</b><span>มิลลิวินาที</span></div>
  </div>
  <div class="done" id="done">🎒 เปิดเทอมแล้ว!</div>
</div>

<script>
const target = new Date("2026-10-26T07:00:00+07:00").getTime();
const $ = id => document.getElementById(id);
const p = (n, l=2) => String(n).padStart(l, "0");
let running = false;

function tick(){
  let diff = target - Date.now();
  if (diff <= 0){
    ["d","h","m","s"].forEach(k => $(k).textContent = "00");
    $("ms").textContent = "000";
    $("done").style.display = "block";
    return;
  }
  $("d").textContent = p(Math.floor(diff/864e5));
  $("h").textContent = p(Math.floor(diff/36e5)%24);
  $("m").textContent = p(Math.floor(diff/6e4)%60);
  $("s").textContent = p(Math.floor(diff/1e3)%60);
  $("ms").textContent = p(diff%1000, 3);
  requestAnimationFrame(tick);
}

$("openBtn").addEventListener("click", () => {
  $("openBtn").disabled = true;
  $("gift").classList.add("open");
  setTimeout(() => {
    $("giftScreen").classList.add("hidden");
    $("cdScreen").classList.remove("hidden");
    if (!running){ running = true; tick(); }
  }, 1300);
});
</script>
</body>
</html>
